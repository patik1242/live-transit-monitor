# databricks.yml
# Databricks Asset Bundle for the Tristar project.
#
# One bundle, two targets:
#   dev  -> Databricks Free Edition. .
#   prod -> Azure Databricks.
#
##
# Deploy dev:   databricks bundle deploy -t dev
# Run job:      databricks bundle run transit_gps_stream    -t dev
# Run pipeline: databricks bundle run transit_silver_ldp  -t dev
# Deploy prod:  databricks bundle deploy -t prod

bundle:
  name: live-transit-monitor

# Defaults. Each target overrides the values it needs.
variables:
  catalog:
    description: Unity Catalog to read/write.
    default: workspace
  bronze_schema:
    description: Bronze schema.
    default: bronze
  silver_schema:
    description: Silver schema.
    default: silver


# ===========================================================================
# Declarative Pipeline
# ===========================================================================
resources:
  pipelines:
    transit_silver_ldp:
      name: live-transit-monitor-${bundle.target}   # live-transit-monitor-dev / -prod
      catalog: ${var.catalog}                    # target catalog (workspace on dev, dbr_dev on prod)
      schema: ${var.silver_schema}               # where the pipeline writes its tables
      serverless: true                          

      libraries:
        - file:
            path: ./ldp_pipeline.py

      # Becomes spark.conf entries, read by spark.conf.get(...) in the pipeline file.
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}

      environment:
          dependencies:
            - databricks-labs-dqx
targets:
  # ===========================================================================
  # DEV  —  Free Edition
  # ===========================================================================
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8697dee0-e1e6.cloud.databricks.com
    variables:
      catalog: workspace
      bronze_schema: live_transit_monitor
      silver_schema: live_transit_monitor
    resources:
      jobs:
        transit_gps_stream:
          name: transit-gps-stream-dev
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00
            timezone_id: Europe/Warsaw
            pause_status: PAUSED
          tasks:
            # BRONZE — dev = seeder
            - task_key: bronze
              notebook_task:
                notebook_path: ./bronze_streaming/00_setup_dev_bronze.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}

            # SILVER - LDP pipeline
            - task_key: silver_ldp
              depends_on:
                - task_key: bronze
              pipeline_task:
                pipeline_id: ${resources.pipelines.transit_silver_ldp.id}

            # # GOLD — dims -> fact -> aggregations
            - task_key: gold_dimensions
              depends_on:
                - task_key: silver_ldp
              notebook_task:
                notebook_path: ./gold/05_gold_dimensions.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
            - task_key: gold_fact
              depends_on:
                - task_key: gold_dimensions
              notebook_task:
                notebook_path: ./gold/06_gold_fact_vehicle_status.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
            - task_key: gold_aggregations
              depends_on:
                - task_key: gold_fact
              notebook_task:
                notebook_path: ./gold/07_gold_aggregations.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
                  
           # - task_key: gold_data_quality
           #   depends_on:
           #     - task_key: gold_dqx
           #   notebook_task:
           #     notebook_path: ./gold/08_gold_dqx.ipynb
           #     base_parameters:
           #       catalog: ${var.catalog}
           #       bronze_schema: ${var.silver_schema}



  # ===========================================================================
  # PROD  —  Azure Databricks, real ENTSO-E API + Azure Event Hub
  # ===========================================================================
  prod:
    mode: production           # schedule ACTIVE
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/gabrielajaniszews786@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      bronze_schema: live_transit_monitor
      silver_schema: live_transit_monitor
    resources:
      jobs:
        transit_gps_stream:
          name: transit-gps-stream-prod
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00
            pause_status: PAUSED
            timezone_id: Europe/Warsaw
          tasks:

            # --- Bronze: gps positions ---
            - task_key: bronze
              notebook_task:
                notebook_path: ./bronze_streaming/02_gps_consumer.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.bronze_schema}
                  consumer_group: "$Default"
                  secret_key: "eh-conn-transit"
                  secret_scope: "default2"
                  starting_offsets: "earliest"
                  storage_account: "dlspl21databricks"
                  eh_namespace: "evhpl24databricks02"
            
            # SILVER - LDP pipeline
            - task_key: silver_ldp
              depends_on:
                - task_key: bronze
              pipeline_task:
                pipeline_id: ${resources.pipelines.transit_silver_ldp.id}

            # GOLD — dims -> fact -> aggregations
            - task_key: gold_dimensions
              depends_on:
                - task_key: silver_ldp
              notebook_task:
                notebook_path: ./gold/05_gold_dimensions.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
            - task_key: gold_fact
              depends_on:
                - task_key: gold_dimensions
              notebook_task:
                notebook_path: ./gold/06_gold_fact_vehicle_status.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
            - task_key: gold_aggregations
              depends_on:
                - task_key: gold_fact
              notebook_task:
                notebook_path: ./gold/07_gold_aggregations.ipynb
                base_parameters:
                  catalog: ${var.catalog}
                  bronze_schema: ${var.silver_schema}
